<!--
  Canonical master for the application icon.

  The shipped ICO is generated by scripts/generate_app_icon.py, which
  renders each of the nine Windows sizes separately rather than
  downsampling this one: 译 has thirteen strokes, and a small tile gives
  the glyph more of the square to spend them on. This file is the
  reference for the large sizes and for anyone editing the artwork.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#007AFF"/>
      <stop offset="1" stop-color="#0055B8"/>
    </linearGradient>
  </defs>
  <rect x="15" y="15" width="994" height="994" rx="222" fill="url(#tile)"/>
  <!-- The static specular edge: the visual direction's stand-in for a
       highlight that cannot respond to what is behind it. -->
  <rect x="15" y="15" width="994" height="994" rx="222"
        fill="none" stroke="#FFFFFF" stroke-opacity="0.25" stroke-width="12"/>
  <text x="512" y="512" text-anchor="middle" dominant-baseline="central"
        font-family="Microsoft YaHei UI, Microsoft YaHei, sans-serif"
        font-size="635" font-weight="700" fill="#FFFFFF">译</text>
</svg>
